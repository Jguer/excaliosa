[package]
name = "excaliosa"
version = "0.3.0"
edition = "2024"
authors = ["Jo <git@jguer.space>"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
clap = { version = "4.5", features = ["derive"] }
tiny-skia = { version = "0.11", features = ["png-format"] }
anyhow = "1.0"
palette = "0.7"
euclid = "0.22"
num-traits = "0.2"
skrifa = "0.37"
roughr = "0.12"
png = "0.17"
base64 = "0.22"
same-file = "1.0"
tempfile = "3"